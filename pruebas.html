<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pruebas de ambilight</title>
<style>
  :root{ --dim:#8b93a1; --acc:#4da3ff; --line:#2a303a; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:#e6e9ef;overflow:hidden;
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    cursor:default}
  body.oculto{cursor:none}
  #lienzo{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* El panel va al CENTRO a proposito: los LEDs muestrean solo el 8% exterior,
     asi que nada de lo que se dibuje aqui contamina la captura. */
  #panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(10,12,15,.93);border:1px solid var(--line);border-radius:16px;
    padding:20px 22px;width:min(560px,86vw);backdrop-filter:blur(6px);
    transition:opacity .25s}
  body.oculto #panel{opacity:0;pointer-events:none}
  h1{font-size:16px;margin:0 0 3px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:15px}

  .pats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;
    margin-bottom:15px}
  .pats button{background:#171a1f;color:inherit;border:1px solid var(--line);
    border-radius:9px;padding:9px 8px;font:inherit;font-size:13px;cursor:pointer}
  .pats button:hover{background:#1f242c}
  .pats button.on{border-color:var(--acc);background:#13202e;color:var(--acc)}

  .fila{display:flex;align-items:center;gap:12px;padding:9px 0;
    border-top:1px solid var(--line);font-size:13.5px}
  .fila span:first-child{flex:1;color:var(--dim)}
  .val{font-variant-numeric:tabular-nums;color:var(--acc);font-size:17px;min-width:52px;
    text-align:right}
  input[type=range]{flex:1.2;accent-color:var(--acc)}

  #tiras{display:flex;gap:2px;margin-top:14px;height:16px}
  #tiras i{flex:1;border-radius:1px;background:#15181d}

  kbd{background:#1f242c;border:1px solid var(--line);border-radius:5px;
    padding:1px 6px;font:12px ui-monospace,monospace;color:var(--dim)}
  .ayuda{color:var(--dim);font-size:12px;margin-top:14px;line-height:1.9}
</style>
</head>
<body>
<canvas id="lienzo"></canvas>

<div id="panel">
  <h1>Pruebas de posición</h1>
  <div class="sub">Muestra esto en la TV. Los LEDs reaccionan a las orillas;
    este recuadro central no se captura.</div>

  <div class="pats" id="pats"></div>

  <div class="fila" id="filaLed">
    <span>LED señalado</span>
    <input type="range" id="idx" min="0" max="179" value="0">
    <div class="val" id="idxV">0</div>
  </div>
  <div class="fila">
    <span>Velocidad del recorrido</span>
    <input type="range" id="vel" min="1" max="30" value="8">
    <div class="val" id="velV">8</div>
  </div>

  <div id="tiras"></div>
  <div class="sub" style="margin:7px 0 0" id="pie">&nbsp;</div>

  <div class="ayuda">
    <kbd>espacio</kbd> recorrer / pausar &nbsp;
    <kbd>←</kbd><kbd>→</kbd> un LED &nbsp;
    <kbd>1</kbd>–<kbd>5</kbd> patrón<br>
    <kbd>F</kbd> pantalla completa &nbsp;
    <kbd>H</kbd> ocultar este recuadro
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const cv = $('#lienzo'), cx = cv.getContext('2d');
let LAYOUT = null, LEDS = null;
let patron = 'bordes', idx = 0, corriendo = false, ultimo = 0;

const PATRONES = [
  ['bordes',   'Bordes'],
  ['recorrido','Recorrido'],
  ['zonas',    'Por lado'],
  ['blanco',   'Blanco'],
  ['negro',    'Negro'],
];

$('#pats').innerHTML = PATRONES.map(([k,n]) =>
  '<button data-p="' + k + '">' + n + '</button>').join('');
document.querySelectorAll('.pats button').forEach(b =>
  b.onclick = () => ponPatron(b.dataset.p));

function ponPatron(p){
  patron = p;
  if (p !== 'recorrido') corriendo = false;
  document.querySelectorAll('.pats button').forEach(b =>
    b.classList.toggle('on', b.dataset.p === p));
  $('#filaLed').style.display = (p === 'recorrido') ? '' : 'none';
  pinta();
}

function ajusta(){
  cv.width = innerWidth; cv.height = innerHeight;
  pinta();
}
addEventListener('resize', ajusta);

// Rectangulo en pixeles de la zona que muestrea un LED del layout.
function zona(L){
  return [L.hmin*cv.width, L.vmin*cv.height,
          (L.hmax-L.hmin)*cv.width, (L.vmax-L.vmin)*cv.height];
}

function pinta(){
  const W = cv.width, H = cv.height, g = Math.round(Math.min(W,H)*0.085);
  cx.fillStyle = '#000'; cx.fillRect(0,0,W,H);

  if (patron === 'blanco'){ cx.fillStyle='#fff'; cx.fillRect(0,0,W,H); }

  else if (patron === 'bordes'){
    // Un color por lado: revela al instante lados cambiados o espejeados.
    cx.fillStyle = '#ff0000'; cx.fillRect(0, 0, W, g);          // arriba
    cx.fillStyle = '#00ff00'; cx.fillRect(W-g, 0, g, H);        // derecha
    cx.fillStyle = '#0066ff'; cx.fillRect(0, H-g, W, g);        // abajo
    cx.fillStyle = '#ffee00'; cx.fillRect(0, 0, g, H);          // izquierda
    etiqueta('ARRIBA rojo', W/2, g*1.9, '#ff5555');
    etiqueta('DERECHA verde', W-g*1.4, H/2, '#55ff88', 'right');
    etiqueta('ABAJO azul', W/2, H-g*1.4, '#6699ff');
    etiqueta('IZQUIERDA amarillo', g*1.4, H/2, '#ffee55', 'left');
  }

  else if (patron === 'zonas' && LAYOUT){
    // Cada LED pintado con un degradado segun su indice: se ve el sentido.
    LAYOUT.forEach((L, i) => {
      const t = i / (LAYOUT.length - 1);
      cx.fillStyle = 'hsl(' + Math.round(t*300) + ',100%,50%)';
      const [x,y,w,h] = zona(L);
      cx.fillRect(x, y, Math.max(w,3), Math.max(h,3));
    });
    etiqueta('LED 0 rojo → LED ' + (LAYOUT.length-1) + ' violeta', W/2, H*0.78, '#9aa3b2');
  }

  else if (patron === 'recorrido' && LAYOUT){
    const L = LAYOUT[idx];
    if (L){
      const [x,y,w,h] = zona(L);
      cx.fillStyle = '#fff';
      cx.fillRect(x, y, Math.max(w,4), Math.max(h,4));
      etiqueta('LED ' + idx, W/2, H*0.78, '#fff');
    }
  }
}

function etiqueta(txt, x, y, color, align){
  cx.fillStyle = color || '#fff';
  cx.font = '600 ' + Math.round(Math.min(cv.width,cv.height)*0.028) + 'px system-ui';
  cx.textAlign = align || 'center';
  cx.textBaseline = 'middle';
  cx.fillText(txt, x, y);
  cx.textAlign = 'left';
}

// ---- lectura de los LEDs reales, para contrastar contra lo que se pinta ----
async function leeLeds(){
  try {
    const d = await (await fetch('/api/leds')).json();
    if (d.layout && !LAYOUT){
      LAYOUT = d.layout;
      $('#idx').max = LAYOUT.length - 1;
      pinta();
    }
    LEDS = d.leds;
    if (LEDS){
      $('#tiras').innerHTML = LEDS.map(c =>
        '<i style="background:rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')"></i>').join('');
      if (patron === 'recorrido' && LEDS[idx]){
        const c = LEDS[idx];
        $('#pie').textContent = 'LED ' + idx + ' está en rgb(' + c.join(', ') +
          ') — debería verse blanco en la tira.';
      } else {
        $('#pie').textContent = LEDS.length + ' LEDs leídos en vivo.';
      }
    } else {
      $('#pie').textContent = d.error || 'Conectando con HyperHDR…';
    }
  } catch(e){ $('#pie').textContent = 'Sin conexión con el panel.'; }
}

function paso(t){
  if (corriendo && t - ultimo > (1000 / +$('#vel').value)){
    ultimo = t;
    idx = (idx + 1) % (LAYOUT ? LAYOUT.length : 180);
    $('#idx').value = idx; $('#idxV').textContent = idx;
    pinta();
  }
  requestAnimationFrame(paso);
}

$('#idx').oninput = e => { idx = +e.target.value; $('#idxV').textContent = idx;
  corriendo = false; pinta(); };
$('#vel').oninput = e => $('#velV').textContent = e.target.value;

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' '){ e.preventDefault(); ponPatron('recorrido'); corriendo = !corriendo; }
  else if (k === 'arrowright' || k === 'arrowleft'){
    e.preventDefault(); corriendo = false; ponPatron('recorrido');
    const n = LAYOUT ? LAYOUT.length : 180;
    idx = (idx + (k === 'arrowright' ? 1 : n - 1)) % n;
    $('#idx').value = idx; $('#idxV').textContent = idx; pinta();
  }
  else if (k === 'h') document.body.classList.toggle('oculto');
  else if (k === 'f'){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }
  else if (k >= '1' && k <= '5') ponPatron(PATRONES[+k - 1][0]);
});

ajusta(); ponPatron('bordes'); leeLeds();
setInterval(leeLeds, 200);
requestAnimationFrame(paso);
</script>
</body>
</html>
